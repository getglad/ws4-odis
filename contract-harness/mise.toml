# mise < 2026.1.6 silently fails to provision a task's own [tasks.*].tools when
# that task `depends` on another task that has dir + tools (the smoke-vault
# shape) — the vault binary would simply be missing at run time. The floor turns
# that into a clear "update mise" error instead.
min_version = "2026.1.6"

[tools]
# Core newcomer toolchain. Advanced tasks declare their own tools below so a
# fresh `mise install` stays focused on the zero-infrastructure demo.
python = "3.12"
uv = "latest"
opa = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
# `uv sync --locked`, NOT `uv pip install`: `uv pip install` ignores uv.lock, and every
# dependency here is an open lower bound (mcp, ruff, starlette, ...), so it resolves to
# whatever is newest at clone time and drifts across majors. `--locked` installs the
# committed resolution and fails loudly when pyproject.toml disagrees with it.
description = "Install the locked project + dev dependency group into the project venv"
run = "uv sync --locked"

[tasks.demo]
description = "Run the zero-infrastructure Router demo against an in-process Target MCP stub"
env = { ODIS_AUDIT_OUTPUT = "/tmp/odis-demo-audit.jsonl" }
run = "odis-harness demo"

[tasks.test]
description = "Run the pytest suite (the requires_vault slice runs only if vault is already on PATH; test-all guarantees it)"
run = "pytest"

[tasks.test-all]
# `test` only reaches the requires_vault slice when vault happens to be on PATH
# already; otherwise conftest auto-skips those 9 tests and the run still reports green.
# This task provisions vault and builds the plugin, so the slice always runs.
description = "Run the pytest suite with the Vault slice reachable (vault + built plugin)"
depends = ["build-vault-plugin"]
tools = { vault = "latest" }
run = "pytest"

[tasks.typecheck]
description = "Run mypy strict on src"
run = "mypy"

[tasks.lint]
description = "Run ruff lint"
run = "ruff check src tests examples"

[tasks.check]
description = "Run lint + typecheck + tests (Python; check-all adds the Vault slice and the Go plugin suite)"
depends = ["lint", "typecheck", "test"]

[tasks.check-all]
# Depends on the individual gates rather than `check` so pytest runs once (as
# test-all, the superset) instead of twice.
description = "Everything: lint + typecheck + full pytest (incl. Vault slice) + Go plugin lint/tests"
depends = ["lint", "typecheck", "test-all", "lint-vault-plugin", "test-vault-plugin"]

[tasks.build-vault-plugin]
description = "Build the apf-bundle-issuer Vault plugin binary into vault-plugin/dist/"
dir = "vault-plugin"
tools = { go = "1.25" }
run = "go build -o dist/apf-bundle-issuer ."

[tasks.lint-vault-plugin]
description = "Run strict golangci-lint on the apf-bundle-issuer Vault plugin"
dir = "vault-plugin"
tools = { go = "1.25", golangci-lint = "latest" }
run = "golangci-lint run"

[tasks.test-vault-plugin]
description = "Run the Go unit tests for the apf-bundle-issuer Vault plugin"
dir = "vault-plugin"
tools = { go = "1.25" }
run = "go test ./..."

[tasks.smoke-vault]
description = "Boot dev Vault, provision, issue + offline-verify a bundle (vault auto-provisioned; ODIS_VAULT_BIN overrides)"
depends = ["build-vault-plugin"]
tools = { vault = "latest" }
run = "bash vault/smoke.sh"

[tasks."tf:lint"]
description = "Run static checks for the experimental Terraform module"
dir = "terraform"
tools = { tfenv = "latest", tflint = "latest", trivy = "latest" }
run = [
    "terraform fmt -check -recursive",
    "terraform init -backend=false -input=false",
    "terraform validate",
    "tflint",
    # --exit-code 1 makes findings (any severity) fail the task; trivy's default
    # exit code is 0 even when misconfigurations are detected.
    "trivy config --exit-code 1 .",
]

[tasks."tf:plan"]
description = "Initialize and plan the persistent-Vault Terraform resources"
dir = "terraform"
tools = { tfenv = "latest" }
run = [
    "terraform init -input=false",
    "terraform plan",
]

[tasks."tf:apply"]
description = "Initialize and apply the persistent-Vault non-secret resources (tf:configure-signing is the mandatory follow-up)"
dir = "terraform"
tools = { tfenv = "latest" }
run = [
    "terraform init -input=false",
    "terraform apply",
]

[tasks."tf:configure-signing"]
description = "Complete the post-apply Vault signing configuration without storing secret_id in Terraform state"
dir = "terraform"
tools = { tfenv = "latest", vault = "latest", jq = "latest" }
# Ordering, not dependency: when scheduled together (mise run tf:apply tf:configure-signing)
# the signing step waits for apply; running it alone never triggers an apply.
wait_for = ["tf:apply"]
run = "bash configure-signing.sh"

[tasks.demo-openshell]
description = "OpenShell-gated demo: agent inside a REAL OpenShell sandbox → Router gate → vendor (egress enforced). Needs the gateway up first: bash examples/openshell-gated-agent/gateway/setup.sh"
depends = ["build-vault-plugin"]
tools = { vault = "latest", "pipx:openshell" = "latest" }
env = { ODIS_AUDIT_OUTPUT = "/tmp/odis-openshell-audit.jsonl" }
run = "python examples/openshell-gated-agent/openshell_demo.py"

[tasks.openshell-connect]
description = "Register or select the local OpenShell gateway and show its connection status"
tools = { "pipx:openshell" = "latest" }
run = """
if ! openshell gateway info --gateway odis >/dev/null 2>&1; then
    openshell gateway add http://localhost:8080 --local --name odis
fi
openshell gateway select odis
openshell status
"""

